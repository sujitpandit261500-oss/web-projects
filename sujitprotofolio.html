<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CyberDev Portfolio</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#0b0b0b;
    color:#fff;
}

header{
    width:100%;
    padding:20px 8%;
    border-bottom:1px solid rgba(255,255,255,.1);
}

nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    color:#2cff95;
    font-size:30px;
    font-weight:bold;
}

.nav-links{
    list-style:none;
    display:flex;
    gap:35px;
}

.nav-links a{
    color:#fff;
    text-decoration:none;
    transition:.3s;
}

.nav-links a:hover{
    color:#2cff95;
}

.menu{
    display:none;
    font-size:30px;
    cursor:pointer;
}

.hero{
    min-height:90vh;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:50px 8%;
}

.left{
    width:50%;
}

.left h1{
    font-size:70px;
    color:#2cff95;
    line-height:1.2;
    margin-bottom:20px;
}

.left p{
    color:#d0d0d0;
    font-size:18px;
    line-height:1.7;
    margin-bottom:15px;
}

button{
    margin-top:20px;
    padding:15px 35px;
    background:#2cff95;
    color:#000;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:translateY(-3px);
    box-shadow:0 0 20px #2cff95;
}

.right{
    width:45%;
    display:flex;
    justify-content:center;
}

.circle{
    width:420px;
    height:420px;
    border-radius:50%;
    border:5px solid #2cff95;
    box-shadow:0 0 40px #2cff95;
    overflow:hidden;
}

.circle img{
    width:100%;
    height:100%;
    object-fit:cover;
}

@media(max-width:900px){

.menu{
display:block;
}

.nav-links{
display:none;
position:absolute;
top:70px;
right:20px;
background:#111;
padding:20px;
flex-direction:column;
border-radius:10px;
}

.nav-links.active{
display:flex;
}

.hero{
flex-direction:column-reverse;
text-align:center;
}

.left,.right{
width:100%;
}

.left h1{
font-size:50px;
margin-top:40px;
}

.circle{
width:280px;
height:280px;
}

}
</style>

</head>
<body>

<header>
<nav>

<div class="logo">CyberDev</div>

<ul class="nav-links">
<li><a href="#">Home</a></li>
<li><a href="#">Skills</a></li>
<li><a href="#">Projects</a></li>
<li><a href="#">Contact</a></li>
</ul>

<div class="menu">&#9776;</div>

</nav>
</header>

<section class="hero">

<div class="left">
<h1>Full-Stack<br>Developer</h1>

<p>
Building digital experiences that merge creativity with technology.
</p>

<p>
Specializing in modern web development and cyber systems.
</p>

<button>Let's Connect</button>

</div>

<div class="right">
<div class="circle">
<img src="profile.jpg" alt="Profile">
</div>
</div>

</section>

<script>
const menu=document.querySelector(".menu");
const nav=document.querySelector(".nav-links");

menu.onclick=function(){
nav.classList.toggle("active");
};
</script>

</body>
</html>
